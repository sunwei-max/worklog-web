<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微读</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;
            -webkit-text-size-adjust:100%;}
  #wr{position:absolute;left:0;top:0;border:0;background:#fff;}
  #mask{position:absolute;left:0;background:#fff;}
</style>
</head>
<body>
<iframe id="wr" src="https://weread.qq.com/"></iframe>
<div id="mask"></div>
<script>
(function(){
  var wr=document.getElementById('wr'), mask=document.getElementById('mask');
  var CLIP=26;                     /* 只盖住最底部“阅读器”那一行，不动其他按钮 */

  function fit(){
    var W=(document.documentElement.clientWidth||window.innerWidth||600);
    var H=(document.documentElement.clientHeight||window.innerHeight||800);
    wr.style.width=W+'px';
    wr.style.height=H+'px';
    mask.style.top=(H-CLIP)+'px';
    mask.style.width=W+'px';
    mask.style.height=CLIP+'px';
  }

  fit();
  window.onresize=fit;
  setTimeout(fit,800);
  setTimeout(fit,2000);
})();
</script>
</body>
</html>
