<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>微信读书 · 大字版</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;color:#000;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;}
  body{overflow:hidden;-webkit-text-size-adjust:100%;}
  #bar{position:fixed;top:0;left:0;right:0;height:50px;box-sizing:border-box;
    background:#fff;border-bottom:2px solid #000;display:flex;align-items:center;
    padding:0 5px;z-index:10;}
  #bar .t{font-size:15px;font-weight:bold;margin-right:6px;white-space:nowrap;}
  #bar button{font-size:15px;line-height:1;padding:9px 9px;margin:0 2px;border:2px solid #000;
    background:#fff;color:#000;border-radius:6px;min-width:40px;min-height:38px;
    -webkit-appearance:none;appearance:none;font-family:inherit;}
  #bar button:active{background:#000;color:#fff;}
  #bar .pct{font-size:14px;font-weight:bold;min-width:44px;text-align:center;}
  #bar .sp{flex:1;}
  #stage{position:fixed;top:50px;left:0;right:0;bottom:0;overflow:hidden;background:#fff;}
  #wr{position:absolute;top:0;left:0;border:0;background:#fff;
    transform-origin:0 0;-webkit-transform-origin:0 0;}
  #help{position:fixed;left:0;right:0;bottom:0;top:50px;background:#fff;z-index:20;
    padding:18px;font-size:17px;line-height:1.9;display:none;overflow:auto;}
  #help h3{margin:0 0 10px;font-size:19px;}
  #help a{color:#000;text-decoration:underline;}
  #help .x{margin-top:16px;padding:10px 16px;font-size:16px;border:2px solid #000;
    background:#fff;border-radius:6px;}
</style>
</head>
<body>
<div id="bar">
  <span class="t">微信读书</span>
  <button id="minus" title="缩小">A−</button>
  <button id="plus" title="放大">A＋</button>
  <span class="pct" id="pct">150%</span>
  <span class="sp"></span>
  <button id="reload" title="刷新">刷新</button>
  <button id="open" title="在新窗口打开">原页</button>
  <button id="helpBtn" title="说明">?</button>
</div>

<div id="stage">
  <iframe id="wr" src="https://weread.qq.com/" allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<div id="help">
  <h3>使用说明</h3>
  <p>1. 点 <b>A＋</b> / <b>A−</b> 调整整页放大倍数（100%～300%），字号会一起变大，设置会自动记住。</p>
  <p>2. 微信读书自带底部也有「字体」按钮，两者可叠加使用。</p>
  <p>3. 若页面空白或提示未登录：请先在 Kindle 浏览器直接打开
     <a href="https://weread.qq.com/" target="_blank">weread.qq.com</a> 登录一次，再回到本页；或点右上角「原页」直接打开。</p>
  <p>4. 本页只是"放大外壳"，不存储、不转发你的任何账号与阅读数据。</p>
  <button class="x" id="helpClose">知道了</button>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var wr=document.getElementById('wr');
  var pct=document.getElementById('pct');
  var zoom=parseFloat(localStorage.getItem('wr_zoom')||'1.5');
  if(!(zoom>=1&&zoom<=3)) zoom=1.5;

  function apply(){
    var w=stage.clientWidth, h=stage.clientHeight, z=zoom;
    /* 关键：先把 iframe 逻辑尺寸缩小到 1/z，再整体放大 z 倍 —— 等效浏览器缩放 z%，
       文字与界面一起变大，且页面按更窄的宽度重新排版，读起来更舒服 */
    wr.style.width=(w/z)+'px';
    wr.style.height=(h/z)+'px';
    wr.style.transform='scale('+z+')';
    wr.style.webkitTransform='scale('+z+')';
    wr.style.transformOrigin='0 0';
    wr.style.webkitTransformOrigin='0 0';
    pct.textContent=Math.round(z*100)+'%';
    try{ localStorage.setItem('wr_zoom',String(z)); }catch(e){}
  }
  function setZ(v){
    v=Math.round(v*10)/10;
    if(v<1) v=1; if(v>3) v=3;
    zoom=v; apply();
  }

  document.getElementById('plus').onclick=function(){ setZ(zoom+0.1); };
  document.getElementById('minus').onclick=function(){ setZ(zoom-0.1); };
  document.getElementById('reload').onclick=function(){
    try{ wr.contentWindow.location.reload(); }catch(e){ wr.src=wr.src; }
  };
  document.getElementById('open').onclick=function(){
    window.open('https://weread.qq.com/','_blank');
  };
  document.getElementById('helpBtn').onclick=function(){ document.getElementById('help').style.display='block'; };
  document.getElementById('helpClose').onclick=function(){ document.getElementById('help').style.display='none'; };

  window.onresize=apply;
  apply();
})();
</script>
</body>
</html>
