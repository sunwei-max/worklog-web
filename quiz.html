<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>护理刷题</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#f5f6f8;color:#1a1a1a;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:#fff;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.on{display:flex;}
  /* 顶栏 */
  #top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #eee;
    background:#fff;font-size:14px;color:#666;}
  #top .back{font-size:20px;cursor:pointer;color:#1565c0;padding:0 6px;}
  #top .prog{flex:1;text-align:center;font-weight:600;color:#222;}
  #top .rate{color:#1565c0;}
  #top .fs{display:flex;gap:4px;}
  #top .fs button{width:30px;height:30px;border:1px solid #ccc;background:#fff;border-radius:6px;
    font-size:15px;cursor:pointer;}
  /* 首页 */
  #home{padding:24px 18px;gap:14px;}
  #home h1{font-size:24px;margin:8px 0 2px;}
  #home .sub{color:#888;font-size:14px;margin-bottom:14px;}
  .mode{display:block;width:100%;padding:16px;border:1px solid #e0e0e0;border-radius:12px;
    background:#fafbfc;text-align:left;font-size:17px;cursor:pointer;margin-bottom:10px;}
  .mode b{display:block;font-size:18px;color:#1565c0;margin-bottom:2px;}
  .mode span{color:#888;font-size:13px;}
  .mode:active{background:#eef4ff;}
  .btn{width:100%;padding:15px;border:none;border-radius:12px;background:#1565c0;color:#fff;
    font-size:18px;cursor:pointer;margin-top:6px;}
  .btn.ghost{background:#fff;color:#1565c0;border:1px solid #1565c0;}
  .btn:active{opacity:.85;}
  .info{margin-top:18px;font-size:12px;color:#999;line-height:1.6;}
  /* 答题 */
  #quiz{padding:0;}
  #qwrap{padding:18px 16px;flex:1;display:flex;flex-direction:column;}
  #stem{font-size:21px;line-height:1.55;margin-bottom:6px;font-weight:600;}
  #stem .no{color:#1565c0;margin-right:6px;}
  #opts{margin-top:14px;display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:14px 14px;border:1.5px solid #d8dce2;
    border-radius:12px;background:#fff;cursor:pointer;font-size:18px;line-height:1.5;}
  .opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:#eef1f5;color:#444;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .opt:active{background:#f0f4ff;}
  .opt.right{background:#e7f6ec;border-color:#34a853;}
  .opt.right .k{background:#34a853;color:#fff;}
  .opt.wrong{background:#fdecea;border-color:#ea4335;}
  .opt.wrong .k{background:#ea4335;color:#fff;}
  #fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px;display:none;
    background:#eef4ff;color:#333;border:1px solid #d6e4ff;}
  #fb b{color:#1565c0;}
  #fb .ans{color:#34a853;font-weight:700;}
  #next{margin-top:12px;display:none;}
  /* 结算 */
  #result{padding:30px 20px;align-items:center;text-align:center;gap:14px;}
  #result .big{font-size:46px;font-weight:700;color:#1565c0;}
  #result .row{font-size:17px;color:#444;}
  #result .det{display:flex;gap:24px;margin:8px 0 18px;}
  #result .det div{font-size:15px;}
  #result .det b{display:block;font-size:28px;}
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <section id="home" class="screen on">
    <div style="padding:0 18px;">
      <h1>护理刷题</h1>
      <div class="sub">共 <span id="total">0</span> 题 · 单选 · 自动记录错题</div>
      <button class="mode" data-mode="seq"><b>顺序练习</b><span>从第 1 题开始，按原题顺序</span></button>
      <button class="mode" data-mode="rand"><b>随机练习</b><span>打乱顺序，全面覆盖</span></button>
      <button class="mode" data-mode="wrong"><b>错题重练</b><span id="wrongTip">只练之前答错的题</span></button>
      <div class="info">
        答题后立即判分，答错的题自动存入错题本（保存在本机浏览器）。<br>
        建议用手机浏览器打开，可加到主屏当 App 用。
      </div>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen">
    <div id="top">
      <span class="back" id="back">‹</span>
      <span class="prog" id="prog">1 / 0</span>
      <span class="rate" id="rate">正确率 0%</span>
      <span class="fs"><button id="fsMinus">A−</button><button id="fsPlus">A＋</button></span>
    </div>
    <div id="qwrap">
      <div id="stem"></div>
      <div id="opts"></div>
      <div id="fb"></div>
      <button class="btn" id="next">下一题 ›</button>
    </div>
  </section>

  <!-- 结算 -->
  <section id="result" class="screen">
    <div class="big" id="rRate">0%</div>
    <div class="row">本轮练习完成</div>
    <div class="det">
      <div>答对<b id="rOk" style="color:#34a853">0</b></div>
      <div>答错<b id="rBad" style="color:#ea4335">0</b></div>
      <div>共<b id="rTot">0</b></div>
    </div>
    <button class="btn" id="rAgain">再来一轮</button>
    <button class="btn ghost" id="rWrong">只练错题</button>
    <button class="btn ghost" id="rHome">回首页</button>
  </section>
</div>

<script>window.QUIZ=[{"no": 1, "stem": "护理程序的步骤为：", "opts": [{"k": "A", "t": "评估.计划.实施"}, {"k": "B", "t": "评估.计划.实施.评价"}, {"k": "C", "t": ".评估.诊断.计划.实施.评价"}, {"k": "D", "t": "评估.整理.诊断.计划.实施.评价"}], "ans": "C"}, {"no": 2, "stem": "新生儿病室适宜的温度.湿度应保持在多少?", "opts": [{"k": "A", "t": "温度22—24℃, 湿度50%一60%"}, {"k": "B", "t": "温度18—22℃, 湿度50%一60%"}, {"k": "C", "t": "温度22—24℃, 湿度60%一70%"}, {"k": "D", "t": "温度18—22℃, 湿度60%一70%"}], "ans": "A"}, {"no": 3, "stem": "一般病室温度.湿度应保持在多少?", "opts": [{"k": "A", "t": "温度22—24℃, 湿度50%一60%"}, {"k": "B", "t": "温度18—22℃, 湿度50%一60%"}, {"k": "C", "t": "温度22—24℃, 湿度60%一70%"}, {"k": "D", "t": "温度18—22℃, 湿度60%一70%"}], "ans": "B"}, {"no": 4, "stem": "高血压患者日常生活中限制钠盆摄人，做到", "opts": [{"k": "A", "t": "<2g/d"}, {"k": "B", "t": "<5g/d"}, {"k": "C", "t": "<6 g/d"}, {"k": "D", "t": "<8g/d"}], "ans": "C"}, {"no": 5, "stem": "缓解支气管哮喘急性发作的药物是", "opts": [{"k": "A", "t": "α受体激动剂.茶碱类和抗胆碱类药"}, {"k": "B", "t": "β受体激动剂.茶碱类和抗胆碱类药"}, {"k": "C", "t": "H受体激动剂.茶碱类和抗胆碱类药"}, {"k": "D", "t": "M受体激动剂.茶碱类和抗胆碱类药"}], "ans": "B"}, {"no": 6, "stem": "系统性红斑狼疮最常见的死亡原因是什么", "opts": [{"k": "A", "t": "感染.呼吸衰竭.心力衰竭"}, {"k": "B", "t": "出血.感染.脑损害"}, {"k": "C", "t": "呼吸衰竭.出血."}, {"k": "D", "t": "感染.肾衰竭.脑损害和心力衰竭"}], "ans": "D"}, {"no": 7, "stem": "痛风病人的饮食原则", "opts": [{"k": "A", "t": "低嘌呤.低脂肪.高热量.低盐和多饮水"}, {"k": "B", "t": "低嘌呤.低脂肪.低热量.低盐和多饮水"}, {"k": "C", "t": "低嘌呤.低脂肪.低热量.低盐和少饮水"}, {"k": "D", "t": "低嘌呤.高脂肪.低热量.低盐和多饮水"}], "ans": "B"}, {"no": 8, "stem": "脑出血最严重的并发症是", "opts": [{"k": "A", "t": "脑疝"}, {"k": "B", "t": "窒息"}, {"k": "C", "t": "昏迷"}, {"k": "D", "t": "心力衰竭"}], "ans": "A"}, {"no": 9, "stem": "简述腰椎穿刺术的体位要求", "opts": [{"k": "A", "t": "患者膝胸卧位，屈颈抱膝"}, {"k": "B", "t": "患者侧卧位，屈颈抱膝"}, {"k": "C", "t": "患者侧卧，背齐床沿，屈颈抱膝"}, {"k": "D", "t": "患者去枕侧卧，背齐床沿，屈颈抱膝"}], "ans": "D"}, {"no": 10, "stem": "腰椎穿刺术后并发症最常见的是", "opts": [{"k": "A", "t": "脑疝"}, {"k": "B", "t": "感染"}, {"k": "C", "t": "头痛"}, {"k": "D", "t": "腰痛"}], "ans": "C"}, {"no": 11, "stem": "颅内动脉瘤血管栓塞治疗的术后穿刺部位加压包扎制动", "opts": [{"k": "A", "t": <script>
(function(){
  var Q = window.QUIZ || [];
  var KEY_WRONG='nq_wrong_v1', KEY_FS='nq_fs_v1';
  var st={mode:'seq',order:[],idx:0,answered:false,sel:null,ok:0,bad:0,fromWrong:false,fs:20};
  function $(id){return document.getElementById(id);}
  function show(id){['home','quiz','result'].forEach(function(s){
    $(s).className='screen'+(s===id?' on':'');});}
  function getWrong(){try{return JSON.parse(localStorage.getItem(KEY_WRONG)||'[]');}catch(e){return [];}}
  function saveWrong(a){localStorage.setItem(KEY_WRONG,JSON.stringify(a));}
  function addWrong(no){var a=getWrong();if(a.indexOf(no)<0){a.push(no);saveWrong(a);}}
  function applyFs(){document.documentElement.style.fontSize=st.fs+'px';
    try{localStorage.setItem(KEY_FS,String(st.fs));}catch(e){}}
  function updateTop(){
    $('prog').textContent=(st.idx+1)+' / '+st.order.length;
    var tot=st.ok+st.bad;
    $('rate').textContent='正确率 '+(tot?(Math.round(st.ok/tot*100)):0)+'%';
  }
  function start(mode){
    st.mode=mode; st.idx=0; st.ok=0; st.bad=0; st.fromWrong=(mode==='wrong');
    if(mode==='wrong'){
      var w=getWrong();
      st.order=w.map(function(no){return Q.findIndex(function(x){return x.no===no;});})
              .filter(function(i){return i>=0;});
      if(!st.order.length){alert('暂无错题，先去顺序或随机练习吧');return;}
    } else if(mode==='rand'){
      st.order=Q.map(function(_,i){return i;});
      for(var i=st.order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
        var t=st.order[i];st.order[i]=st.order[j];st.order[j]=t;}
    } else {
      st.order=Q.map(function(_,i){return i;});
    }
    show('quiz'); render();
  }
  function render(){
    st.answered=false; st.sel=null;
    var q=Q[st.order[st.idx]];
    $('stem').innerHTML='<span class="no">'+q.no+'.</span>'+escapeHtml(q.stem);
    var h='';
    q.opts.forEach(function(o){
      h+='<div class="opt" data-k="'+o.k+'"><span class="k">'+o.k+'</span><span class="t">'
        +escapeHtml(o.t)+'</span></div>';
    });
    $('opts').innerHTML=h;
    $('fb').style.display='none'; $('next').style.display='none';
    Array.prototype.forEach.call($('opts').children,function(el){
      el.onclick=function(){choose(el.getAttribute('data-k'));};
    });
    updateTop();
  }
  function choose(k){
    if(st.answered)return;
    st.answered=true; st.sel=k;
    var q=Q[st.order[st.idx]];
    var correct=(k===q.ans);
    if(correct)st.ok++; else {st.bad++; addWrong(q.no);}
    Array.prototype.forEach.call($('opts').children,function(el){
      var ek=el.getAttribute('data-k');
      if(ek===q.ans)el.className='opt right';
      else if(ek===k)el.className='opt wrong';
      el.onclick=null;
    });
    var fb=$('fb'); fb.style.display='block';
    fb.innerHTML=(correct?'✅ 回答正确':'❌ 回答错误')+'　正确答案：<span class="ans">'
      +q.ans+'</span>';
    $('next').style.display='block';
    updateTop();
  }
  function next(){
    st.idx++;
    if(st.idx>=st.order.length)showResult();
    else render();
  }
  function showResult(){
    var tot=st.ok+st.bad;
    $('rRate').textContent=(tot?Math.round(st.ok/tot*100):0)+'%';
    $('rOk').textContent=st.ok; $('rBad').textContent=st.bad; $('rTot').textContent=tot;
    var wn=getWrong().length;
    $('rWrong').textContent= wn? ('只练错题 ('+wn+')') : '只练错题';
    $('rWrong').style.opacity= wn?1:.4;
    show('result');
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // 绑定
  Array.prototype.forEach.call(document.querySelectorAll('.mode'),function(b){
    b.onclick=function(){start(b.getAttribute('data-mode'));};});
  $('back').onclick=function(){show('home');refreshHome();};
  $('next').onclick=next;
  $('fsPlus').onclick=function(){st.fs=Math.min(28,st.fs+1);applyFs();};
  $('fsMinus').onclick=function(){st.fs=Math.max(15,st.fs-1);applyFs();};
  $('rAgain').onclick=function(){start(st.fromWrong?'wrong':st.mode);};
  $('rWrong').onclick=function(){start('wrong');};
  $('rHome').onclick=function(){show('home');refreshHome();};
  function refreshHome(){
    $('total').textContent=Q.length;
    var wn=getWrong().length;
    $('wrongTip').textContent= wn? ('只练之前答错的题（'+wn+' 道）') : '只练之前答错的题';
  }
  // 初始化
  try{var f=parseInt(localStorage.getItem(KEY_FS));if(f)st.fs=f;}catch(e){}
  applyFs(); refreshHome();
})();
</script>
