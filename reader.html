<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>读</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;color:#000;
            -webkit-text-size-adjust:100%;
            font-family:Georgia,"Times New Roman","Microsoft YaHei",serif;}
  #book{position:absolute;left:0;top:0;overflow:auto;-webkit-overflow-scrolling:touch;
        background:#fff;}
  #book .inner{padding:18px 18px 18px 18px;}
  #book h1{font-size:1.15em;line-height:1.4;margin:6px 0 14px;}
  #book h2{font-size:1.0em;line-height:1.4;margin:22px 0 10px;
           border-left:4px solid #000;padding-left:8px;}
  #book p{font-size:1em;line-height:1.85;margin:0 0 16px;text-align:justify;}
  #bar{position:absolute;left:0;bottom:0;width:100%;border-collapse:collapse;
       border-top:1px solid #000;background:#fff;}
  #bar td{padding:0;vertical-align:middle;white-space:nowrap;text-align:center;}
  #bar button{font-size:16px;line-height:1;padding:6px 10px;margin:2px;border:1px solid #000;
       background:#fff;color:#000;border-radius:4px;-webkit-appearance:none;appearance:none;
       font-family:inherit;}
  #bar .info{font-size:12px;color:#444;padding:0 6px;}
</style>
</head>
<body>
<div id="book"><div class="inner" id="inner"></div></div>
<table id="bar" cellspacing="0" cellpadding="0" border="0"><tr>
  <td><button id="minus">A−</button></td>
  <td><button id="plus">A＋</button></td>
  <td class="info" id="info">载入中…</td>
  <td><button id="prev">‹</button></td>
  <td><button id="next">›</button></td>
</tr></table>

<script>
(function(){
  var book=document.getElementById('book'),
      inner=document.getElementById('inner'),
      bar=document.getElementById('bar'),
      info=document.getElementById('info');

  var MINF=18, MAXF=40, fs=24;
  try{ var s=localStorage.getItem('rd_fs'); if(s) fs=parseInt(s,10); }catch(e){}
  if(!(fs>=MINF)) fs=24; if(fs>MAXF) fs=MAXF;

  function applyFs(){
    book.style.fontSize=fs+'px';
    try{ localStorage.setItem('rd_fs',String(fs)); }catch(e){}
  }

  function fit(){
    var W=(document.documentElement.clientWidth||window.innerWidth||600);
    var H=(document.documentElement.clientHeight||window.innerHeight||800);
    var BH=bar.offsetHeight||30; if(BH<20)BH=30;
    book.style.width=W+'px';
    book.style.height=H+'px';
    book.style.top='0px';
    book.style.bottom=BH+'px';
    bar.style.width=W+'px';
  }

  function screen(){ return book.clientHeight || 700; }

  function next(){ book.scrollTop += screen()*0.96; }
  function prev(){ book.scrollTop -= screen()*0.96; }

  document.getElementById('plus').onclick=function(){ fs=Math.min(MAXF,fs+2); applyFs(); };
  document.getElementById('minus').onclick=function(){ fs=Math.max(MINF,fs-2); applyFs(); };
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=prev;
  window.onresize=fit;

  function setInfo(t){ info.innerHTML=t; }

  function render(data){
    inner.innerHTML='';
    var h1=document.createElement('h1'); h1.innerHTML=(data.author?data.author+' · ':'')+data.title; inner.appendChild(h1);
    (data.chapters||[]).forEach(function(c){
      var h2=document.createElement('h2'); h2.innerHTML=c.title||''; inner.appendChild(h2);
      (c.paras||[]).forEach(function(t){
        var p=document.createElement('p'); p.innerHTML=t; inner.appendChild(p);
      });
    });
    setInfo('字号 '+fs+' · 共 '+((data.chapters||[]).length)+' 章');
  }

  function load(){
    if(window.XMLHttpRequest){
      var x=new XMLHttpRequest();
      x.open('GET','book.json?t='+(new Date().getTime()),true);
      x.onreadystatechange=function(){
        if(x.readyState===4){
          if(x.status===200 && x.responseText){
            try{ render(JSON.parse(x.responseText)); }
            catch(e){ setInfo('解析失败：'+e.message); }
          } else {
            setInfo('载入 book.json 失败（HTTP '+(x.status||'网络错误')+'）');
          }
        }
      };
      x.send();
    } else { setInfo('浏览器太老，无法读取数据'); }
  }

  applyFs(); fit();
  setTimeout(fit,400);
  load();
  setTimeout(fit,800);
})();
</script>
</body>
</html>
